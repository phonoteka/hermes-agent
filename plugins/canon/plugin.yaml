name: canon
version: "1.0.0"
description: "Mechanical Hermes transport for Canon CLI commands. Pause notifications require plugins.entries.canon.allow_gateway_injection: true and cover only runs in the plugin default store."
kind: standalone
provides_tools:
  - canon_validate
  - canon_compile
  - canon_run
  - canon_stream
  - canon_checkpoint
  - canon_resume
  - canon_pause
  - canon_cancel
  - canon_restart
  - canon_inspect
  - canon_index
